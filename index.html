
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USDT Send Demo</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#08090d;color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;display:flex;
 justify-content:center;align-items:center;padding:16px
}
.app{width:100%;max-width:410px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.top button,.max{
 background:#242630;color:#fff;border:0;
 border-radius:20px;padding:10px 15px;cursor:pointer
}
h2{font-size:19px}
.label{color:#9295a1;font-size:13px;margin-bottom:12px}
.address{
 background:#191b24;padding:15px;border-radius:13px;
 font-size:13px;overflow-wrap:anywhere;margin-bottom:35px
}
.amount{text-align:center;margin-bottom:25px}
.amount input{
 width:100%;background:none;border:0;outline:none;
 color:white;text-align:center;font-size:58px;
 font-weight:600
}
.amount input::placeholder{color:#555}
.usd{color:#999;margin-top:8px}
.token{
 background:#191b24;padding:15px;border-radius:14px;
 display:flex;justify-content:space-between;align-items:center;
 margin-bottom:25px
}
.token strong{font-size:16px}
.token small{color:#999}
.keypad{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:12px;margin-bottom:22px
}
.keypad button{
 background:#191b24;color:#fff;border:0;
 border-radius:12px;height:57px;font-size:22px;cursor:pointer
}
.keypad button:active{background:#343746}
.review{
 width:100%;padding:17px;border:0;border-radius:30px;
 background:#20b875;color:#06130d;font-size:17px;
 font-weight:bold;cursor:pointer
}
.status{font-size:12px;color:#a8acb8;text-align:center;margin-top:17px}
.modal{
 display:none;position:fixed;inset:0;background:#000c;
 align-items:center;justify-content:center;padding:20px
}
.modalbox{
 background:#191b24;padding:25px;border-radius:18px;
 width:100%;max-width:360px
}
.modalbox p{margin:15px 0;color:#c6c8d0;overflow-wrap:anywhere}
.modalbox button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:10px;cursor:pointer}
.confirm{background:#20b875;font-weight:bold}
.close{background:#30333e;color:white}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <h2>Send USDT</h2>
  <button id="connect">Connect Wallet</button>
 </div>

 <div class="label">To</div>
 <div class="address">
  <input id="recipient" placeholder="Enter recipient address"
   style="width:100%;background:none;border:0;color:white;outline:none">
 </div>

 <div class="amount">
  <input id="amount" value="0" inputmode="decimal" readonly>
  <div class="usd">≈ $<span id="usd">0.00</span> USD</div>
 </div>

 <div class="token">
  <div>
   <strong>🟢 USDT</strong><br>
   <small>Testnet demo token display</small>
  </div>
  <button class="max" id="max">MAX</button>
 </div>

 <div class="keypad" id="keypad">
  <button>1</button><button>2</button><button>3</button>
  <button>4</button><button>5</button><button>6</button>
  <button>7</button><button>8</button><button>9</button>
  <button>.</button><button>0</button><button>⌫</button>
 </div>

 <button class="review" id="review">Review</button>
 <div class="status" id="status">Connect Trust Wallet to view your testnet balance.</div>
</div>

<div class="modal" id="modal">
 <div class="modalbox">
  <h2>Review Details</h2>
  <p>Recipient: <span id="reviewTo"></span></p>
  <p>Amount: <span id="reviewAmount"></span> USDT (demo)</p>
  <p>Network: BNB Smart Chain Testnet</p>
  <p>This is a preview only. No token transfer or approval will occur.</p>
  <button class="confirm" id="confirm">Got it</button>
  <button class="close" id="close">Cancel</button>
 </div>
</div>

<script>
let wallet=null;
let balance="0";
const amount=document.getElementById("amount");
const status=document.getElementById("status");

function update(){
 let n=Number(amount.value)||0;
 document.getElementById("usd").textContent=n.toFixed(2);
}
document.querySelectorAll("#keypad button").forEach(btn=>{
 btn.onclick=()=>{
  let v=btn.textContent;
  if(v==="⌫"){
   amount.value=amount.value.length>1?amount.value.slice(0,-1):"0";
  }else if(v==="."){
   if(!amount.value.includes("."))amount.value+=".";
  }else{
   amount.value=amount.value==="0"?v:amount.value+v;
  }
  update();
 };
});

document.getElementById("max").onclick=()=>{
 status.textContent="MAX is unavailable until a verified test token is configured.";
};

document.getElementById("connect").onclick=async()=>{
 try{
  if(!window.ethereum){
   status.textContent="Open this page in a wallet-enabled browser.";
   return;
  }
  const accounts=await window.ethereum.request({
   method:"eth_requestAccounts"
  });
  wallet=accounts[0];
  const chain=await window.ethereum.request({method:"eth_chainId"});
  document.getElementById("connect").textContent="Connected";
  if(parseInt(chain,16)!==97){
   status.textContent="Please switch to BNB Smart Chain Testnet (Chain ID 97).";
   return;
  }
  const provider=new ethers.BrowserProvider(window.ethereum);
  const bal=await provider.getBalance(wallet);
  balance=ethers.formatEther(bal);
  status.textContent="Connected: "+wallet.slice(0,8)+"..."+wallet.slice(-6)+" | Test BNB: "+Number(balance).toFixed(4);
 }catch(e){
  status.textContent=e.message||"Connection failed.";
 }
};

document.getElementById("review").onclick=()=>{
 const to=document.getElementById("recipient").value.trim();
 const n=Number(amount.value);
 if(!wallet){status.textContent="Please connect your wallet first.";return;}
 if(!ethers.isAddress(to)){status.textContent="Enter a valid recipient address.";return;}
 if(!Number.isFinite(n)||n<=0){status.textContent="Enter a valid amount.";return;}
 document.getElementById("reviewTo").textContent=to;
 document.getElementById("reviewAmount").textContent=n.toFixed(2);
 document.getElementById("modal").style.display="flex";
};
document.getElementById("close").onclick=()=>{
 document.getElementById("modal").style.display="none";
};
document.getElementById("confirm").onclick=()=>{
 document.getElementById("modal").style.display="none";
 status.textContent="Preview completed. No transaction was sent.";
};
if(window.ethereum){
 window.ethereum.on("chainChanged",()=>location.reload());
 window.ethereum.on("accountsChanged",()=>location.reload());
}
</script>
</body>
</html>
